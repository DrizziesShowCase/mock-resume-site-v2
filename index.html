<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f2" />
    <!-- Defaults for the first paint; src/components/PageMeta.jsx updates both per route. -->
    <title>Shortlist Résumé Co. — Professional résumé writing</title>
    <meta
      name="description"
      content="Certified résumé writers who interview you, then rewrite your experience into a résumé recruiters call back."
    />
    <!-- Social previews. Crawlers don't run JavaScript, so these are static.
         og:image should be an absolute URL: replace it with the deployed
         GitHub Pages address once the repo exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shortlist Résumé Co." />
    <meta property="og:title" content="Shortlist Résumé Co. — Professional résumé writing" />
    <meta property="og:description" content="A portfolio demo: a résumé-writing service site with a working order configurator. Shortlist Résumé Co. is fictional." />
    <meta property="og:image" content="og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
